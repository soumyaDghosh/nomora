name: Enforce Branch Flow

on:
  push:
    branches:
      - uat
      - prod

jobs:
  enforce-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow
        run: |
          echo "Target branch: ${GITHUB_REF_NAME}"
          echo "Source commit branch: ${GITHUB_HEAD_REF:-"unknown"}"

          # Block direct pushes unless they are merges from the correct branch
          if [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            git fetch origin dev
            if ! git log origin/uat..origin/dev --oneline | grep .; then
              echo "uat was updated without merging from dev."
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_NAME}" == "prod" ]]; then
            git fetch origin uat
            if ! git log origin/prod..origin/uat --oneline | grep .; then
              echo "prod was updated without merging from uat."
              exit 1
            fi
          fi

          echo "Branch flow is valid."