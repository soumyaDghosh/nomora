name: Enforce Branch Flow

on:
  push:
    branches:
      - uat
      - prod

jobs:
  enforce-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check branch flow
        run: |
          echo "Target branch: ${GITHUB_REF_NAME}"
          echo "Source commit branch: ${GITHUB_HEAD_REF:-"unknown"}"

          if [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            if ! git merge-base --is-ancestor origin/dev origin/uat; then
              echo "uat must only be updated by merging from dev."
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_NAME}" == "prod" ]]; then
            if ! git merge-base --is-ancestor origin/uat origin/prod; then
              echo "prod must only be updated by merging from uat."
              exit 1
            fi
          fi

          echo "Branch flow is valid."