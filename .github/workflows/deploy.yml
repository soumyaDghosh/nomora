name: Deploy Nomora App

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create production .env
        working-directory: frontend
        run: |
          echo "VITE_SERVER_URL=${{ secrets.VPS_SERVER_URL }}" > .env

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install sshpass & rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy to VPS
        run: |
          # Ensure directories exist on VPS
          sshpass -p "${{ secrets.VPS_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /root/Nomora-App/frontend /root/Nomora-App/backend"

          # Deploy frontend dist -> /root/Nomora-App/frontend (replace completely)
          rsync -avz --delete \
            -e "sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/Nomora-App/frontend/

          # Deploy backend folder -> /root/Nomora-App/backend (KEEP node_modules & .env)
          rsync -avz --delete --exclude node_modules --exclude .env \
            -e "sshpass -p '${{ secrets.VPS_PASS }}' ssh -o StrictHostKeyChecking=no" \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/Nomora-App/backend/

          # Install backend dependencies with nvm (must source nvm.sh, not run it)
          sshpass -p "${{ secrets.VPS_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "source /root/.nvm/nvm.sh && cd /root/Nomora-App/backend && npm install"