name: Deploy Nomora App

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create production .env
        working-directory: frontend
        run: |
          echo "VITE_SERVER_URL=${{ secrets.VPS_SERVER_URL }}" > .env
          echo "VITE_MEASUREMENT_ID=${{ secrets.MEASUREMENT_ID }}" >> .env

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          # Ensure directories exist on VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /root/Nomora-App/frontend /root/Nomora-App/backend"

          # Deploy frontend dist -> /root/Nomora-App/frontend (replace completely)
          rsync -avz --delete \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/Nomora-App/frontend/

          # Deploy backend folder -> /root/Nomora-App/backend (KEEP node_modules & .env)
          rsync -avz --delete --exclude node_modules --exclude .env \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/Nomora-App/backend/

          # Install backend dependencies with nvm and restart pm2 app
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash -lc 'source /root/.nvm/nvm.sh && cd /root/Nomora-App/backend && npm install && pm2 restart ${{ secrets.PM2_APP }}'"